<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <h1>Club Signup</h1>
    <form action="#" method="GET">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="number">Age:</label>
        <input type="number" id="age" name="age" min="13" max="19">
        <br>
        <label for="startdate">Date You Can Start:</label>
        <input type="date" name="startdate" id="startdate">
        <br>
        <fieldset>
            <legend>Selected Your Grade Level</legend>
            <label for="grade-9">9</label>
            <input type="radio" name="grade" id="grade-9">
            <label for="grade-10">10</label>
            <input type="radio" name="grade" id="grade-10">
            <label for="grade-11">11</label>
            <input type="radio" name="grade" id="grade-11">
            <label for="grade-12">12</label>
            <input type="radio" name="grade" id="grade-12">
            <br>
            <label for="period">Select Period</label>
            <select name="period" name="period">
                <option value="" disabled selected>Select Period</option>
                <option value="1">Period 1</option>
                <option value="2">Period 2</option>
                <option value="3">Period 3</option>
            </select>
            <label for="grade-9"></label>
            <input type="checkbox" name="" id="">
        </fieldset>
        <button type="submit">Join the Club</button>
    </form>

</body>
</html>
