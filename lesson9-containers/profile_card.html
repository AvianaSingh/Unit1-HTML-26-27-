<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        .tag{
            background-color: rgb(126, 126, 255);
            color: white;
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Aviana Singh</h2>
        <p>
            <span class="tag">Full Stack</span>
            <span class="tag">Java Script</span>
        </p>
        <p>Experience: <span class="years">5 years</span></p>
        <button class="btn">View Profile</button>
    </div>
</body>
</html>
